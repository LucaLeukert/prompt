name: Prompt

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"
  groupSortPosition: top
  minimumXcodeGenVersion: 2.45.0

configs:
  Debug: debug
  Release: release
  ReleaseLocal: release

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/MarkdownUI.git
    exactVersion: 2.4.1
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.0
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath.git
    exactVersion: 1.7.3

settings:
  base:
    CLANG_ENABLE_MODULES: YES
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.0"

targets:
  Prompt:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/Prompt
      - path: Sources/GhosttyAppKit
      - path: .build/ghostty/macos/Sources
        excludes:
          - App/iOS
          - App/macOS/main.swift
          - App/macOS/MainMenu.xib
          - Features/Custom App Icon/DockTilePlugin.swift
          - Ghostty/Surface View/SurfaceView_UIKit.swift
          - GhosttyAppKit
          - Prompt
      - path: .build/ghostty/macos/Assets.xcassets
        buildPhase: resources
      - path: .build/ghostty/macos/Localizable.xcstrings
        buildPhase: resources
        optional: true
      - path: .build/ghostty/macos/Ghostty.sdef
        buildPhase: resources
      - path: Resources/Prompt/Fonts
        type: folder
        createIntermediateGroups: false
        buildPhase: resources
      - path: Resources/Prompt.icon
        buildPhase: resources
    dependencies:
      - framework: .build/ghostty/macos/GhosttyKit.xcframework
      - package: MarkdownUI
      - package: Sparkle
      - package: SwiftMath
      - sdk: Carbon.framework
      - sdk: libc++.tbd
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: Prompt
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        CURRENT_PROJECT_VERSION: 1
        DEAD_CODE_STRIPPING: YES
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        EXECUTABLE_NAME: Prompt
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Prompt-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Prompt
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSAppleEventsUsageDescription: A program running within Prompt would like to use AppleScript.
        INFOPLIST_KEY_NSAudioCaptureUsageDescription: A program running within Prompt would like to access your system audio.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: A program running within Prompt would like to use Bluetooth.
        INFOPLIST_KEY_NSCalendarsUsageDescription: A program running within Prompt would like to access your Calendar.
        INFOPLIST_KEY_NSCameraUsageDescription: A program running within Prompt would like to use the camera.
        INFOPLIST_KEY_NSContactsUsageDescription: A program running within Prompt would like to access your Contacts.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: A program running within Prompt would like to access the local network.
        INFOPLIST_KEY_NSLocationUsageDescription: A program running within Prompt would like to access your location.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: A program running within Prompt would like to use your microphone.
        INFOPLIST_KEY_NSMotionUsageDescription: A program running within Prompt would like to access motion data.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: A program running within Prompt would like to access your Photo Library.
        INFOPLIST_KEY_NSRemindersUsageDescription: A program running within Prompt would like to access your reminders.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: A program running within Prompt would like to use speech recognition.
        INFOPLIST_KEY_NSSystemAdministrationUsageDescription: A program running within Prompt requires elevated privileges.
        INFOPLIST_PREPROCESS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        MARKETING_VERSION: "0.1"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lstdc++"
        PRODUCT_BUNDLE_IDENTIFIER: net.leukert.prompt
        PRODUCT_MODULE_NAME: Prompt
        PRODUCT_NAME: Prompt
        SWIFT_ACTIVE_COMPILATION_CONDITIONS:
          - "$(inherited)"
          - PROMPT
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_OBJC_BRIDGING_HEADER: .build/ghostty/macos/Sources/App/macOS/ghostty-bridging-header.h
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Config/PromptDebug.entitlements
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          PRODUCT_BUNDLE_IDENTIFIER: net.leukert.prompt.debug
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          CODE_SIGN_ENTITLEMENTS: Config/Prompt.entitlements
          GCC_OPTIMIZATION_LEVEL: fast
        ReleaseLocal:
          CODE_SIGN_ENTITLEMENTS: Config/PromptDebug.entitlements
          GCC_OPTIMIZATION_LEVEL: fast

  PromptTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Tests
    dependencies:
      - target: Prompt
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: net.leukert.prompt.tests
        PRODUCT_MODULE_NAME: PromptTests
        PRODUCT_NAME: PromptTests
        SWIFT_VERSION: "5.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Prompt.app/Contents/MacOS/Prompt"

schemes:
  Prompt:
    build:
      targets:
        Prompt: all
        PromptTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: PromptTests
          parallelizable: true
    profile:
      config: ReleaseLocal
    analyze:
      config: Debug
    archive:
      config: Release
