name: Publish production build

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish unsigned macOS app
    if: github.ref == 'refs/heads/production'
    runs-on: macos-26
    timeout-minutes: 90
    environment: production
    permissions:
      contents: write

    steps:
      - name: Check out source and Ghostty submodule
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Show selected Xcode
        run: xcodebuild -version

      - name: Install build tools
        run: brew install zig@0.15 xcodegen

      - name: Cache Swift packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            DerivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Config/Package.resolved') }}

      - name: Run Prompt tests
        run: make test

      - name: Build unsigned Release app
        run: make build CONFIGURATION=Release

      - name: Resolve release version
        id: release
        run: |
          marketing_version="$(awk '/MARKETING_VERSION:/ { gsub(/"/, "", $2); print $2; exit }' project.yml)"
          build_version="$(awk '/CURRENT_PROJECT_VERSION:/ { print $2; exit }' project.yml)"
          test -n "$marketing_version"
          test -n "$build_version"
          tag="v${marketing_version}.${build_version}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Release tag already exists: $tag" >&2
            echo "Increment MARKETING_VERSION or CURRENT_PROJECT_VERSION in project.yml." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            Artifacts/Release/Prompt.app \
            Prompt-unsigned-macos.zip
          shasum -a 256 Prompt-unsigned-macos.zip > Prompt-unsigned-macos.zip.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Prompt-unsigned-macos-${{ steps.release.outputs.tag }}
          path: |
            Prompt-unsigned-macos.zip
            Prompt-unsigned-macos.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$TAG" \
            Prompt-unsigned-macos.zip \
            Prompt-unsigned-macos.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "Prompt $TAG" \
            --notes "Unsigned macOS build from $GITHUB_SHA. macOS will show a Gatekeeper warning because this artifact is intentionally not code signed or notarized."
