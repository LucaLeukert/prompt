name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build, and test
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Install development tools
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install swiftformat swiftlint actionlint xcodegen zig@0.15

      # Ghostty is pinned as a submodule and changes far less often than Prompt.
      # Keep its expensive Zig compilation cache until the toolchain, submodule,
      # or one of our integration patches changes.
      - name: Resolve native build cache key
        id: native-cache
        run: |
          echo "ghostty=$(git rev-parse HEAD:Vendor/ghostty)" >> "$GITHUB_OUTPUT"
          echo "xcode=$(xcodebuild -version | tr '\n' '-' | tr -cd '[:alnum:]._-')" >> "$GITHUB_OUTPUT"

      - name: Prepare Ghostty worktree
        run: make sync

      - name: Run linters
        run: make lint

      # actions/checkout and make sync give every source file a fresh mtime.
      # Restore deterministic mtimes before loading Xcode's incremental state,
      # so unchanged files remain older than their cached object files.
      - name: Restore source timestamps
        run: python3 Scripts/restore-source-mtimes.py

      - name: Cache Ghostty build
        id: ghostty-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .build/ghostty/.zig-cache
            .build/ghostty/macos/GhosttyKit.xcframework
            .build/ghostty/zig-out
          key: ghostty-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-cache.outputs.xcode }}-zig-0.15-${{ steps.native-cache.outputs.ghostty }}-${{ hashFiles('Patches/ghostty/*.patch') }}

      - name: Cache Swift packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            DerivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Config/Package.resolved') }}

      # Preserve Xcode's incremental build graph and compiled dependencies, but
      # leave the large index and module caches out. Xcode still recompiles any
      # Prompt source files changed since this baseline.
      - name: Cache Xcode build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            DerivedData/Build
            DerivedData/SDKStatCaches.noindex
            Artifacts/Debug
          key: xcode-debug-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-cache.outputs.xcode }}-${{ steps.native-cache.outputs.ghostty }}-${{ hashFiles('Patches/ghostty/*.patch', 'Config/Package.resolved', 'project.yml', 'Makefile') }}

      - name: Build and test
        env:
          GHOSTTY_CACHE_HIT: ${{ steps.ghostty-cache.outputs.cache-hit }}
        run: |
          target="test"
          if [[ "$GHOSTTY_CACHE_HIT" == "true" ]]; then
            target="test-prepared"
          fi
          make "$target" \
            XCODEBUILD_SETTINGS="DEBUG_INFORMATION_FORMAT=dwarf COMPILER_INDEX_STORE_ENABLE=NO"
