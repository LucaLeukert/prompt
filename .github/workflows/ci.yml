name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - production

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Install lint tools
        run: make lint-install

      - name: Run linters
        run: make lint

  build-and-test:
    name: Validate repository wiring
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source and Ghostty submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify isolated Ghostty integration
        run: |
          make sync
          git diff --check
          git -C Vendor/ghostty diff --check
          test -z "$(git -C Vendor/ghostty status --porcelain)"
          test ! -e .build/ghostty/macos/Sources/Prompt
          test ! -e .build/ghostty/macos/Sources/GhosttyAppKit

      - name: Validate project definition
        run: |
          python3 - <<'PY'
          from pathlib import Path

          spec = Path("project.yml").read_text()
          assert "name: Prompt" in spec
          assert "Vendor/ghostty/macos/Sources/Prompt" not in spec
          assert ".build/ghostty/macos/Sources" in spec
          PY
